<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/blue_M.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the theme before the page paints to avoid a light flash.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('portfolio-theme');
        } catch {
          // Device preference still works when storage is unavailable.
        }
        const dark = preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#131619' : '#ffffff';
      })();
    </script>

    <title>Mika Vohl</title>
    <meta
      name="description"
      content="Mika Vohl's portfolio showcasing projects in machine learning and software development"
    />
    <link rel="canonical" href="https://mikavohl.ca" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mika Vohl" />
    <meta
      property="og:description"
      content="My portfolio showcasing projects in machine learning and software development"
    />
    <meta property="og:url" content="https://mikavohl.ca" />
    <meta
      property="og:image"
      content="https://mikavohl.ca/images/preview.png"
    />
    <meta property="og:site_name" content="Mika Vohl" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mika Vohl" />
    <meta
      name="twitter:description"
      content="My portfolio showcasing projects in machine learning and software development"
    />
    <meta
      name="twitter:image"
      content="https://mikavohl.ca/images/preview.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
